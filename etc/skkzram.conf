# skkzram configuration file
# Uncomment and modify the following lines to customize zram behavior

# Compression algorithm to use
# Available options: lzo, lz4, zlib, lz4hc, zstd
# Default: lz4
# ALGO=lz4

# Size of the zram device
# Can be specified in bytes, KiB, MiB, GiB
# Default: 3G
# SIZE=3G

# Swap priority (higher number means higher priority)
# Values range from -1 to 32767
# Default: 100
# PRIO=100

# Number of zram devices to create
# Default: 1
# DEVICES=1

# Log level
# 0 = ERROR, 1 = WARN, 2 = INFO, 3 = DEBUG
# Default: 2 (INFO)
# LOG_LEVEL=2

# Writeback device (optional)
# If set, idle pages will be written to this device
# Example: WRITEBACK_DEV=/dev/sda1
# WRITEBACK_DEV=

# Maximum memory usage percentage (optional)
# If set, limits zram to use only this percentage of total memory
# MEM_PERCENTAGE_LIMIT=

# Idle writeback timeout in seconds (optional)
# Pages that haven't been accessed for this long will be written to
# the writeback device if configured
# IDLE_WRITEBACK_SECS=

# Enable memory tracking (optional)
# If set to 1, enables memory tracking for detailed monitoring
# MEM_TRACKING=0

